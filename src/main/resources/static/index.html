<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>기록상회</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/handover.css">
  <link rel="stylesheet" href="/css/landing.css">
  <link rel="stylesheet" href="/css/header.css">
</head>
<body>
  <header class="site-header"><div class="landing-shell">
          <div class="landing-head">
            <button class="landing-logo" data-page="landing"><span class="logo-mark">P</span><span>기록상회<small>PRODUCT PASSPORT</small></span></button>
            <label class="landing-search"><input aria-label="상품 검색" placeholder="찾고 있는 노트북을 검색하세요."><span>⌕</span></label>
            <div class="landing-account"><button>로그인</button><span>|</span><button>회원가입</button></div>
          </div>
          <nav class="landing-nav">
            <div class="nav-item"><button data-page="landing">홈</button></div><div class="nav-item"><button data-page="home">내 제품</button><div class="nav-drop"><button data-page="home"><b>내 제품 목록</b><small>등록한 제품을 한눈에 확인</small></button><button data-page="register"><b>새 제품 등록</b><small>구매 정보와 문서를 함께 등록</small></button><button data-page="documents"><b>문서 보관함</b><small>영수증·보증서 모아보기</small></button><button data-page="ai"><b>AI 이력 검색</b><small>제품 이력을 질문으로 찾기</small></button></div></div><div class="nav-item"><button data-page="market">중고거래</button><div class="nav-drop"><button data-page="market"><b>중고 상품 둘러보기</b><small>이력이 확인된 노트북 보기</small></button><button data-page="register"><b>내 제품 판매 준비</b><small>제품을 등록하고 판매 시작</small></button><button data-page="trade"><b>안심 거래 진행</b><small>진행 중인 거래 확인</small></button></div></div><div class="nav-item"><button data-page="passport">제품 여권</button><div class="nav-drop"><button data-page="passport"><b>제품 여권 보기</b><small>공개 가능한 이력 확인</small></button><button data-page="documents"><b>문서 보관함</b><small>구매·수리 문서 확인</small></button><button data-page="ai"><b>AI 이력 검색</b><small>수리·관리 기록 빠르게 찾기</small></button></div></div><div class="nav-item"><button data-page="trade">안심 거래</button><div class="nav-drop"><button data-page="trade"><b>소유권 이전</b><small>일회성 QR로 안전하게 인계</small></button><button data-page="market"><b>중고거래 목록</b><small>거래할 상품 찾기</small></button></div></div><button class="landing-nav-more">내 제품의 기록을 한 곳에서 관리하세요.</button>
          </nav>
  </div></header>
  <div class="app">
    <aside class="side" id="side">
      <div class="side-current"><span>현재 페이지</span><strong id="side-crumb">내 제품</strong></div>
      <div class="logo" data-page="landing" role="button" tabindex="0" style="cursor:pointer"><span class="logo-mark">▣</span><span>기록상회<small>PRODUCT PASSPORT</small></span></div>
      <div class="side-label">WORKSPACE</div>
      <nav class="nav">
        <button class="active" data-page="home"><span class="nav-icon">▦</span>내 제품</button>
        <button data-page="documents"><span class="nav-icon">▧</span>문서 보관함</button>
        <button data-page="ai"><span class="nav-icon">✦</span>AI 이력 검색</button>
        <div class="side-divider"></div>
        <button data-page="trade"><span class="nav-icon">⇄</span>거래 · 소유권 이전</button>
      </nav>
      <div class="account"><span class="avatar">김</span><div><strong>김기록</strong><span>내 계정</span></div></div>
    </aside>
    <main class="main">
      <section class="landing-page page active" id="landing"></section>
      <header class="top"><div class="crumb"><button class="mobile-menu" id="menu">☰</button><span>⌂</span><span>/</span><strong id="crumb">내 제품</strong></div><div class="top-right"><span>예시 데이터로 둘러보기</span><span>◦</span><span>기록이 만드는 더 나은 거래</span></div></header>

      <section class="page" id="home"></section>
      <section class="page" id="passport"></section>
      <section class="page" id="register"></section>
      <section class="page" id="documents"></section>
      <section class="page" id="market"></section>
      <section class="page" id="trade"></section>
    </main>
  </div>
  <script src="/js/pages.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/trade.js"></script>
</body>
</html>
